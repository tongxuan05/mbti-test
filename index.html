<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暴躁打工人性格测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans SC', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #f97316 0%, #ef4444 100%); }
    .option-btn { transition: all 0.2s ease; }
    .option-btn:hover { transform: scale(1.02); }
    .option-btn.selected { background: linear-gradient(135deg, #f97316 0%, #ef4444 100%); color: white; border-color: transparent; }
    .progress-bar { transition: width 0.3s ease; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app"></div>
  <script>
    var questions = [
      { id: 1, dim: 'AB', text: '晚上10点刚下班到家，老板钉钉发来消息："有个小问题你顺手处理下"，你会？', opts: [
        { text: '凌晨2点钉钉回复老板并@全员："已处理完，附件是解决方案、复盘报告和明年规划"，然后继续加班到6点顺便把公司WiFi密码改了', val: 'A' },
        { text: '直接手机关机睡觉，第二天早上说"昨晚手机被我家狗叼走啃了，就已经成渣了"', val: 'B' }]},
      { id: 2, dim: 'AB', text: '开会时老板当众diss你："你做的什么东西，大学生就这水平？"，你会？', opts: [
        { text: '反手一巴掌拍在桌子上把水杯震飞，"你说什么？你再说一遍试试？"然后开始360度托马斯全旋式输出', val: 'A' },
        { text: '低头说"对不起我改"，心里已经把老板做成了表情包发到闺蜜群', val: 'B' }]},
      { id: 3, dim: 'AB', text: '周五晚上11点，客户打电话说方案要大改，周一早上要用，你会？', opts: [
        { text: '"改可以，加钱"，对方不加钱直接拉黑，顺手把号码标记为"诈骗电话"', val: 'A' },
        { text: '"好的好的我今晚赶出来"，通宵到周日早上5点，然后发朋友圈"又是充实的一天呢"', val: 'B' }]},
      { id: 4, dim: 'AB', text: '同事把他的周报甩给你说"你帮我写一下呗，我请了病假"，结果他在朋友圈晒三亚旅游，你会？', opts: [
        { text: '把截图甩到公司大群并@老板@HR@所有人，建议看看这位请病假去三亚的同事', val: 'A' },
        { text: '帮他写了，然后在周报里悄悄写上"本月最大的收获是学会了替同事写周报"', val: 'B' }]},
      { id: 5, dim: 'AB', text: '领导说"这个周末大家加个班吧，没有加班费但是可以调休"，你会？', opts: [
        { text: '"领导，上次调休我还剩48小时，要不您先批了？不批我今天可能不太加得动"', val: 'A' },
        { text: '"好的收到"，然后周末在家一边刷剧一边把PPT字体从微软雅黑改成宋体假装在工作', val: 'B' }]},
      { id: 6, dim: 'SC', text: '公司年会要抽表演节目，你被抽中了，你会？', opts: [
        { text: '直接上台唱一首《征服》，唱到一半把西装外套脱了露出里面的"我爱工作"文化衫', val: 'S' },
        { text: '提前三天开始焦虑，年会当天凌晨发烧39度去医院，医生都说"你这烧得有点巧啊"', val: 'C' }]},
      { id: 7, dim: 'SC', text: '新来了一个实习生坐你旁边，一天到晚问你问题，你会？', opts: [
        { text: '拉他进群吃午饭，"有什么不懂的尽管问，哥罩着你，但请先叫我一声师傅"', val: 'S' },
        { text: '戴上降噪耳机播放"办公室白噪音"，实在躲不过就说"这个嘛...你查一下百度"', val: 'C' }]},
      { id: 8, dim: 'SC', text: '跨部门开会，对方部门的人疯狂甩锅给你们，你会？', opts: [
        { text: '当场站起来打开投影仪放出邮件截图和聊天记录，用激光笔一条条指着怼', val: 'S' },
        { text: '低头疯狂记笔记，表面"好的好的我们再看看"，心里已经给对方写好了悼词', val: 'C' }]},
      { id: 9, dim: 'SC', text: '老板在公司大群里@你问"这个项目进度怎么样了"，你会？', opts: [
        { text: '立刻回复一个500字详细报告，附带甘特图、风险矩阵、里程碑计划和后续三个预案', val: 'S' },
        { text: '已读不回，等老板私聊我才回"哎呀刚才在开会没看到，进度挺好的"', val: 'C' }]},
      { id: 10, dim: 'SC', text: '隔壁部门的小哥哥/小姐姐天天找你聊天，你会？', opts: [
        { text: '聊啊！顺便问问有没有对象，没有的话周末约个饭，有的话问问能不能介绍给闺蜜/兄弟', val: 'S' },
        { text: '表面微笑回复"嗯嗯哈哈嗯嗯"，内心"求求你了让我安静干活吧我真的不是社牛"', val: 'C' }]},
      { id: 11, dim: 'PR', text: '手里有三个deadline，但你一点都不想干，你会？', opts: [
        { text: '打开B站刷"打工人日常"视频，坚信"deadline才是第一生产力"，最后一晚咖啡当水喝奇迹般地全搞定', val: 'P' },
        { text: '当天就开始做，做了个Excel排期表精确到每小时，提前两天全部完成还多出一份复盘报告', val: 'R' }]},
      { id: 12, dim: 'PR', text: '看到同事每天加班到12点，还在群里发"今天又充实了一天！感恩！"，你会？', opts: [
        { text: '"装什么装，不就是白天摸鱼晚上补作业吗，有本事白天干完啊"', val: 'P' },
        { text: '"大佬带带我！"然后默默把闹钟从9点改到8点半，把午休从1小时改成15分钟', val: 'R' }]},
      { id: 13, dim: 'PR', text: '领导给了一个没人愿意接的烂摊子项目，你会？', opts: [
        { text: '"领导，这个项目跟我专业方向不太匹配，我建议让XX来"，精准甩锅一气呵成', val: 'P' },
        { text: '"我来！"，然后花了一周时间梳理流程、建立SOP、把烂摊子变成了公司标杆项目', val: 'R' }]},
      { id: 14, dim: 'PR', text: '你的KPI已经完成了，离年底还有3个月，你会？', opts: [
        { text: '每天准时上下班，剩余时间用来考PMP、学Python、考咖啡师资格证，技多不压身', val: 'P' },
        { text: '主动找领导要更多项目，"我想挑战一下自己"，内心"趁现在多攒点资本年底好谈涨薪"', val: 'R' }]},
      { id: 15, dim: 'PR', text: '公司有个晋升名额，但竞争对手是老板的亲戚/关系户，你会？', opts: [
        { text: '算了算了，命里有时终须有，不跟关系户争，保住狗命要紧，下班买张彩票安慰自己', val: 'P' },
        { text: '就算拼不过也要拼！准备了80页PPT、10个数据模型、3套方案，在评审会上把关系户衬成了实习生', val: 'R' }]},
      { id: 16, dim: 'DF', text: '项目失败了，复盘会上大家都在找原因，你会？', opts: [
        { text: '拿出数据表格和鱼骨图，"第3周开始偏差率超过15%，根因是需求变更太频繁且没有走变更流程"', val: 'D' },
        { text: '"大家别灰心，我们已经做得很好了，失败是成功之母，下次一定能行！"，说完带头鼓掌', val: 'F' }]},
      { id: 17, dim: 'DF', text: '你最好的同事因为失误被领导骂哭了，你会？', opts: [
        { text: '递上纸巾但表情严肃："哭没用，来我帮你分析一下怎么补救，第一步...第二步..."', val: 'D' },
        { text: '陪着一起哭，"这领导就是有病，他不配骂你，走我们去楼下喝奶茶吐槽个痛快"', val: 'F' }]},
      { id: 18, dim: 'DF', text: '实习生把报告写得一塌糊涂，数据错了一大片，你会？', opts: [
        { text: '用红笔标出所有错误并在旁边写上批注，"第3段数据来源不明，第5段逻辑不通，全部重写"', val: 'D' },
        { text: '"整体框架挺好的，思路也很清晰，就是有些小地方需要再完善一下"，然后自己偷偷帮他改了', val: 'F' }]},
      { id: 19, dim: 'DF', text: '朋友微信跟你吐槽"我老板太傻逼了"，你会？', opts: [
        { text: '"具体什么事？把来龙去脉说清楚，我帮你分析分析该怎么应对，要不要考虑跳槽？"', val: 'D' },
        { text: '"就是！傻逼老板千篇一律，来来来吐槽个痛快，我陪你一起骂，骂完去吃火锅"', val: 'F' }]},
      { id: 20, dim: 'DF', text: '你背了黑锅，领导在全公司面前批评了你，但你知道真相，你会？', opts: [
        { text: '当天把证据链整理成PDF文档，包含邮件、截图、时间线，发给所有相关人员要求公开澄清', val: 'D' },
        { text: '找最信任的朋友倾诉到深夜，"我真的好委屈"，然后发条仅自己可见的朋友圈"世界以痛吻我"', val: 'F' ]}
    ];

    var workers = {
      'ASPD': { n: '职场灭霸', e: '\u{1F480}', c: 'from-red-600 to-black', d: '你是职场中最恐怖的存在。敢半夜2点回老板消息证明自己加到6点，敢在会议上反手拍桌子怼老板，社交场上无人能敌，疯狂内卷到所有人都害怕，做事理性到冷酷。你不是在打工，你是在统治职场。', m: '我不是来打工的，我是来教你们做事的', s: '实力碾压就是正义' },
      'ASPF': { n: '暴躁老哥', e: '\u{1F525}', c: 'from-orange-500 to-red-600', d: '你是公司里的"敢说担当"。不爽就说不喜欢就拒绝，社交场上游刃有余，虽然爱摆烂但关键时刻怼人一流。你的暴躁反而让人觉得你真实可爱。', m: '我脾气不好但我很真诚', s: '真诚+暴躁=永远的必杀技' },
      'ASRD': { n: '卷王之王', e: '\u{1F451}', c: 'from-yellow-500 to-amber-700', d: '你敢于表达、善于社交、疯狂内卷到凌晨，理性分析每一步棋。你是领导眼中的人才核弹，但同事觉得你是内卷的罪魁祸首。', m: '卷不死我的都会让我更强', s: '适度内卷，量力而行' },
      'ASRF': { n: '社交悍匪', e: '\u{1F3AD}', c: 'from-pink-500 to-rose-700', d: '你是公司的人气王兼气氛组组长。敢说敢做、社交天花板、拼命三郎还特别会照顾人。有你在的群永远不会冷场。', m: '工作要拼朋友更要交', s: '人脉是你最大的财富' },
      'ACPD': { n: '冷面杀手', e: '\u{1F5E1}\u{FE0F}', c: 'from-slate-700 to-gray-900', d: '你表面忍耐内心翻涌，社恐但理性到可怕。你不会当面爆发但会在心里记小本本，等时机成熟一击致命。', m: '我不说不代表我不知道', s: '沉默是你的保护色' },
      'ACPF': { n: '委屈小可怜', e: '\u{1F622}', c: 'from-blue-400 to-indigo-600', d: '你是公司里最让人心疼的存在。心里有无数句MMP嘴上却说好的收到。社恐摆烂还容易心软。', m: '我没关系（其实很有关系）', s: '学会说"不"是必修课' },
      'ACRD': { n: '暗黑卷王', e: '\u{1F311}', c: 'from-purple-700 to-indigo-900', d: '你表面不声不响内心野心勃勃。社恐但疯狂努力做事，理性分析每一步棋。你是那种不显山露水但最后晋升最快的人。', m: '你们吵的时候我已经做完了', s: '实力是最好的反击' },
      'ACRF': { n: '佛系小天使', e: '\u{1F607}', c: 'from-green-400 to-emerald-700', d: '你是公司里最温暖的存在。默默忍耐社恐但努力工作，还特别会照顾别人的感受。你是团队的隐形守护者。', m: '大家都开心就好', s: '善良需要带点锋芒' },
      'BSPD': { n: '双面打工人', e: '\u{1F3AA}', c: 'from-teal-500 to-cyan-700', d: '你表面乖巧内心暴躁。社交达人但爱摆烂，处理问题理性客观。职场双面人，演得一手好戏。', m: '表面笑嘻嘻心里MMP', s: '演技也是职场技能' },
      'BSPF': { n: '气氛组组长', e: '\u{1F389}', c: 'from-yellow-400 to-orange-600', d: '你表面忍耐但社交能力一流。爱摆烂但特别会照顾人。你是团队的气氛组担当。', m: '开心是一天不开心也是一天', s: '快乐是你最大的武器' },
      'BSRD': { n: '隐忍实干家', e: '\u{1F4AA}', c: 'from-blue-600 to-indigo-800', d: '你表面乖巧实则拼命三郎。社交不错做事更拼，理性分析是你的强项。你是那种被领导夸"踏实可靠"的人。', m: '做就做到最好', s: '执行力决定你的上限' },
      'BSRF': { n: '职场暖男/暖女', e: '\u{2600}\u{FE0F}', c: 'from-amber-400 to-yellow-700', d: '你表面忍耐但社交能力在线，努力工作还特别体贴。你是团队里最受欢迎的存在。', m: '温暖他人也别忘了温暖自己', s: '你的善良自带光芒' },
      'BCPD': { n: '内心戏之王', e: '\u{1F3AC}', c: 'from-violet-500 to-purple-800', d: '你表面乖巧社恐爱摆烂但内心理性分析一切。你每天在心里上演八百集职场连续剧。', m: '我心里跟明镜似的', s: '看透不说透也是智慧' },
      'BCPF': { n: '小透明打工人', e: '\u{1FAE5}', c: 'from-gray-400 to-gray-700', d: '你是公司里最没有存在感的老实人。忍耐社恐摆烂还心软。你总是被忽略被忽视被甩锅。', m: '我只是不爱说话', s: '存在感需要主动刷' },
      'BCRD': { n: '低调实力派', e: '\u{1F3C6}', c: 'from-emerald-500 to-teal-800', d: '你表面乖巧社恐但暗自努力，理性分析能力强。你是那种不声不响就做出成绩的人。', m: '实力会替我说话', s: '低调但有底线' },
      'BCRF': { n: '忍辱负重者', e: '\u{1F422}', c: 'from-cyan-500 to-blue-700', d: '你是公司里最能忍的人。乖巧社恐努力做事还照顾别人感受。你把所有委屈都吞进肚子里。', m: '忍一时风平浪静', s: '委屈自己要有度' },
      'BSPF2': { n: '耿直打工人', e: '\u{1F4AC}', c: 'from-red-400 to-pink-700', d: '你表面忍耐但心直口快，社交能力强但有自己的节奏。感性而真实，摆烂但有底线。', m: '有话直说不憋着', s: '直率但要注意方式' },
      'BCPD2': { n: '摸鱼哲学家', e: '\u{1F41F}', c: 'from-blue-400 to-teal-700', d: '你表面乖巧内心有自己的小世界。社恐但理性，善于摸鱼但不误事。你是职场里的生活家。', m: '摸鱼也是一门艺术', s: '摸鱼不误砍柴工' },
      'BSRD2': { n: '靠谱工具人', e: '\u{1F528}', c: 'from-orange-500 to-red-600', d: '你表面忍耐但能社交，疯狂输出理性分析。你是领导最好用的工具人，什么事交给你都放心。', m: '交给我你放心', s: '靠谱但不卑微' },
      'ACPF2': { n: '心软打工人', e: '\u{1F494}', c: 'from-rose-400 to-pink-700', d: '你表面忍耐内心暴躁但就是爆发不出来，社恐感性摆烂。你最大的弱点就是心太软。', m: '我不是好欺负我只是善良', s: '善良要有锋芒' }
    };

    var curQ = -1;
    var ans = {};
    var pkMode = 'none';
    var pkData = null;

    function render() {
      var app = document.getElementById('app');
      if (pkMode === 'challenge') {
        var t = workers[pkData.typeKey];
        app.innerHTML = '<div class="gradient-bg min-h-screen flex items-center justify-center px-4"><div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-2xl w-full fade-in"><div class="text-center"><div class="text-6xl mb-4">\u2694\u{FE0F}</div><h1 class="text-3xl font-bold text-gray-800 mb-3">你被挑战了！</h1><div class="bg-gray-50 rounded-xl p-4 mb-6"><div class="text-4xl mb-2">' + t.e + '</div><p class="text-xl font-bold text-gray-700">' + t.n + '（' + pkData.typeKey + '）</p><p class="text-gray-500 mt-1">"' + t.m + '"</p></div><p class="text-gray-600 mb-6">完成测试，看看谁能更暴躁！</p><button onclick="startPKTest()" class="gradient-bg text-white px-10 py-4 rounded-full text-lg font-semibold hover:opacity-90 transition-opacity shadow-lg">接受挑战 \u2192</button></div></div></div>';
        return;
      }
      if (pkMode === 'result') {
        var r = calc();
        var p2 = { typeKey: r.typeKey, n: workers[r.typeKey].n, e: workers[r.typeKey].e, c: workers[r.typeKey].c, m: workers[r.typeKey].m, sc: { A: r.A, B: r.B, S: r.S, C: r.C, P: r.P, R: r.R, D: r.D, F: r.F } };
        app.innerHTML = renderPK(pkData, p2);
        return;
      }
      if (curQ === -1) { app.innerHTML = renderWelcome(); }
      else if (curQ < questions.length) { app.innerHTML = renderQuestion(); }
      else { app.innerHTML = renderResult(); }

    function renderWelcome() {

      if (yr === 30) {
        if (R >= 3 && A >= 3) return ye.highR_highA;
        if (R >= 3 && A < 3) return ye.highR_lowA;
        if (R < 3 && S >= 3) return ye.lowR_highS;
        if (R < 3 && S < 3) return ye.lowR_lowS;
        if (P >= 3) return ye.highP;
        if (F >= 3) return ye.highF;
        if (D >= 3) return ye.highD;
        return ye.highS;
      }
      // Year 1 fallback
      if (A >= 3) return ye.highA;
      if (R >= 3) return ye.highR;
      if (S >= 3) return ye.highS;
      return ye.lowA;
    }

    function renderPK(p1, p2) {
      var t1 = workers[p1.typeKey], t2 = workers[p2.typeKey];
      var years = [
        { yr: 1, title: '\u{1F4CB} 入职第1年：初来乍到' },
        { yr: 3, title: '\u{1F525} 第3年：站稳脚跟' },
        { yr: 5, title: '\u{1F4BC} 第5年：人生分岔口' },
        { yr: 8, title: '\u{1F3E5} 第8年：身体和灵魂' },
        { yr: 10, title: '\u{1F454} 第10年：三十而立' },
        { yr: 15, title: '\u{1F3C3} 第15年：中年危机' },
        { yr: 20, title: '\u{1F468}\u200D\u{1F469}\u200D\u{1F467} 第20年：家和事业' },
        { yr: 25, title: '\u{1F31F} 第25年：知天命' },
        { yr: 30, title: '\u{1F305} 第30年：人生结局' }
      ];

      var dimsHTML = '';
      var dims = [{ k: 'A', l: '暴躁', c: 'from-red-400 to-red-600' }, { k: 'S', l: '社交', c: 'from-yellow-400 to-orange-500' }, { k: 'R', l: '内卷', c: 'from-amber-400 to-amber-600' }, { k: 'F', l: '感性', c: 'from-pink-400 to-rose-500' }];
      for (var i = 0; i < dims.length; i++) {
        var d = dims[i];
        var s1v = Math.round((p1.sc[d.k]/5)*100);
        var s2v = Math.round((p2.sc[d.k]/5)*100);
        dimsHTML += '<div><div class="flex justify-between text-sm mb-1"><span class="font-semibold text-gray-700">' + d.l + '指数</span></div><div class="flex items-center gap-2"><span class="text-xs font-bold w-8 text-right text-orange-600">' + s1v + '%</span><div class="flex-1 h-3 rounded-full bg-gradient-to-r ' + d.c + '" style="width:' + s1v + '%"></div><span class="text-xs text-gray-400">|</span><div class="flex-1 h-3 rounded-full bg-gradient-to-r ' + d.c + '" style="width:' + s2v + '%"></div><span class="text-xs font-bold w-8 text-blue-600">' + s2v + '%</span></div></div>';
      }

      var storyHTML = '';
      for (var j = 0; j < years.length; j++) {
        var yr = years[j];
        var p1evt = story(p1.sc, t1, yr.yr);
        var p2evt = story(p2.sc, t2, yr.yr);
        var borderCls = j > 0 ? 'border-t pt-8' : '';
        storyHTML += '<div class="mb-8 ' + borderCls + '"><div class="text-center mb-4"><span class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-4 py-1 rounded-full text-sm font-bold">' + yr.title + '</span></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-orange-50 rounded-xl p-4 border-l-4 border-orange-500"><p class="font-bold text-orange-700 mb-2">' + t1.e + ' ' + t1.n + '</p><p class="text-gray-700">' + p1evt + '</p></div><div class="bg-blue-50 rounded-xl p-4 border-l-4 border-blue-500"><p class="font-bold text-blue-700 mb-2">' + t2.e + ' ' + t2.n + '</p><p class="text-gray-700">' + p2evt + '</p></div></div></div>';
      }

      var html = '<div class="min-h-screen bg-gray-50 py-8 px-4"><div class="max-w-4xl mx-auto">';
      html += '<div class="text-center mb-8 fade-in"><div class="text-5xl mb-2">\u2694\u{FE0F}</div><h1 class="text-4xl font-bold text-gray-800 mb-2">PK 结果</h1></div>';
      html += '<div class="grid grid-cols-2 gap-4 mb-8 fade-in">';
      html += '<div class="bg-white rounded-2xl shadow-lg p-6 text-center"><div class="text-5xl mb-2">' + t1.e + '</div><h2 class="text-xl font-bold bg-gradient-to-r ' + t1.c + ' bg-clip-text text-transparent">' + p1.typeKey + '</h2><p class="text-lg text-gray-700 font-medium">' + t1.n + '</p><p class="text-sm text-gray-500 mt-1">"' + t1.m + '"</p></div>';
      html += '<div class="bg-white rounded-2xl shadow-lg p-6 text-center"><div class="text-5xl mb-2">' + t2.e + '</div><h2 class="text-xl font-bold bg-gradient-to-r ' + t2.c + ' bg-clip-text text-transparent">' + p2.typeKey + '</h2><p class="text-lg text-gray-700 font-medium">' + t2.n + '</p><p class="text-sm text-gray-500 mt-1">"' + t2.m + '"</p></div>';
      html += '</div>';
      html += '<div class="bg-white rounded-2xl shadow-lg p-6 mb-8 fade-in"><h3 class="text-xl font-bold text-gray-800 mb-4 text-center">\u{1F4CA} 四维对比</h3><div class="space-y-4">' + dimsHTML + '</div></div>';
      html += '<div class="bg-white rounded-2xl shadow-lg p-6 mb-8 fade-in"><h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">\u{1F3AC} 职场人生：他们的30年</h3>' + storyHTML + '</div>';
      html += '<div class="text-center space-y-4">';
      html += '<button onclick="restart()" class="gradient-bg text-white px-10 py-4 rounded-full text-lg font-semibold hover:opacity-90 transition-opacity shadow-lg">\u{1F504} 自己再测一次</button>';
      html += '<div><button onclick="showPK()" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-10 py-4 rounded-full text-lg font-semibold hover:opacity-90 transition-opacity shadow-lg">\u2694\u{FE0F} 再找一个人PK</button></div>';
      html += '</div></div></div>';
      return html;
    }

    // 初始化
    curQ = -1;
    var urlParams = new URLSearchParams(window.location.search);
    var pkParam = urlParams.get('pk');
    if (pkParam) {
      try {
        pkData = JSON.parse(decodeURIComponent(escape(atob(pkParam))));
        pkMode = 'challenge';
      } catch(e) {}
    }
    render();
  </script>
</body>
</html>
