              <div class="progress-bar gradient-bg h-3 rounded-full" style="width: ${progress}%"></div>
            </div>
            <div class="text-center mb-4 text-gray-600">
              第 ${currentQuestion + 1} / ${questions.length} 题
            </div>
            
            <div class="bg-white rounded-2xl shadow-lg p-8 fade-in">
              <h2 class="text-2xl font-semibold text-gray-800 mb-8 text-center">${q.text}</h2>
              
              <div class="space-y-4">
                ${q.options.map((opt, idx) => `
                  <button
                    onclick="selectAnswer(${q.id}, '${opt.value}')"
                    class="option-btn w-full p-5 border-2 rounded-xl text-left text-lg ${selectedAnswer === opt.value ? 'selected' : 'border-gray-200 hover:border-orange-400'}"
                  >
                    <div class="flex items-center">
                      <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center mr-4 ${selectedAnswer === opt.value ? 'border-white bg-white bg-opacity-20' : 'border-gray-300'}">
                        ${String.fromCharCode(65 + idx)}
                      </div>
                      <span>${opt.text}</span>
                    </div>
                  </button>
                `).join('')}
              </div>
              
              <div class="flex justify-between mt-8 pt-6 border-t">
                <button
                  onclick="prevQuestion()"
                  class="px-6 py-3 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors ${currentQuestion === 0 ? 'invisible' : ''}"
                >
                  ← 上一题
                </button>
                <button
                  onclick="nextQuestion()"
                  class="px-8 py-3 rounded-lg gradient-bg text-white font-semibold hover:opacity-90 transition-opacity ${!selectedAnswer ? 'opacity-50 cursor-not-allowed' : ''}"
                  ${!selectedAnswer ? 'disabled' : ''}
                >
                  ${currentQuestion === questions.length - 1 ? '查看我是什么打工人' : '下一题 →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderResult() {
      const result = calculateResult();
      const type = typeDataMap[result.typeKey];
      
      return `
        <div class="min-h-screen bg-gray-50 py-8 px-4">
          <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-lg p-8 mb-8 fade-in">
              <div class="text-center mb-8">
                <div class="text-7xl mb-4">${type.emoji}</div>
                <h1 class="text-5xl font-bold bg-gradient-to-r ${type.color} bg-clip-text text-transparent mb-2">
                  ${result.typeKey}
                </h1>
                <p class="text-2xl text-gray-700 font-medium">${type.name}</p>
              </div>
              
              <div class="bg-gray-50 rounded-xl p-6 mb-6 text-center">
                <p class="text-lg font-medium text-gray-700">"${type.motto}"</p>
              </div>
              
              <p class="text-gray-600 text-lg leading-relaxed mb-8">${type.description}</p>
              
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                ${renderDimension('A', 'B', result.A, result.B, '爆发型', '忍耐型', 'from-red-400 to-red-600', 'from-blue-400 to-blue-600')}
                ${renderDimension('S', 'C', result.S, result.C, '社交牛人', '社恐达人', 'from-yellow-400 to-orange-500', 'from-indigo-400 to-indigo-600')}
                ${renderDimension('P', 'R', result.P, result.R, '摆烂型', '卷王型', 'from-green-400 to-green-600', 'from-amber-400 to-amber-600')}
                ${renderDimension('D', 'F', result.D, result.F, '理性输出', '情感输出', 'from-cyan-400 to-blue-500', 'from-pink-400 to-rose-500')}
              </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-lg p-8 mb-8 fade-in">
              <h2 class="text-2xl font-bold text-gray-800 mb-6">💡 打工人生存法则</h2>
              <div class="bg-gradient-to-br ${type.color} text-white rounded-xl p-6 text-center">
                <p class="text-xl font-semibold">${type.survival}</p>
              </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-lg p-8 mb-8 fade-in">
              <h2 class="text-2xl font-bold text-gray-800 mb-4">📊 你的打工人画像</h2>
              <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-50 rounded-xl p-4">
                  <p class="text-sm text-gray-500 mb-1">暴躁指数</p>
                  <div class="w-full bg-gray-200 rounded-full h-4">
                    <div class="bg-gradient-to-r from-red-400 to-red-600 h-4 rounded-full" style="width: ${Math.round((result.A / 5) * 100)}%"></div>
                  </div>
                  <p class="text-right text-sm font-semibold text-gray-700 mt-1">${Math.round((result.A / 5) * 100)}%</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4">
                  <p class="text-sm text-gray-500 mb-1">社交指数</p>
                  <div class="w-full bg-gray-200 rounded-full h-4">
                    <div class="bg-gradient-to-r from-yellow-400 to-orange-500 h-4 rounded-full" style="width: ${Math.round((result.S / 5) * 100)}%"></div>
                  </div>
                  <p class="text-right text-sm font-semibold text-gray-700 mt-1">${Math.round((result.S / 5) * 100)}%</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4">
                  <p class="text-sm text-gray-500 mb-1">内卷指数</p>
                  <div class="w-full bg-gray-200 rounded-full h-4">
                    <div class="bg-gradient-to-r from-amber-400 to-amber-600 h-4 rounded-full" style="width: ${Math.round((result.R / 5) * 100)}%"></div>
                  </div>
                  <p class="text-right text-sm font-semibold text-gray-700 mt-1">${Math.round((result.R / 5) * 100)}%</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4">
                  <p class="text-sm text-gray-500 mb-1">感性指数</p>
                  <div class="w-full bg-gray-200 rounded-full h-4">
                    <div class="bg-gradient-to-r from-pink-400 to-rose-500 h-4 rounded-full" style="width: ${Math.round((result.F / 5) * 100)}%"></div>
                  </div>
                  <p class="text-right text-sm font-semibold text-gray-700 mt-1">${Math.round((result.F / 5) * 100)}%</p>
                </div>
              </div>
            </div>
            
            <div class="text-center">
              <button onclick="restartTest()" class="gradient-bg text-white px-10 py-4 rounded-full text-lg font-semibold hover:opacity-90 transition-opacity shadow-lg">
                🔄 再测一次
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDimension(left, right, leftCount, rightCount, leftLabel, rightLabel, leftColor, rightColor) {
      const total = leftCount + rightCount;
      const leftPercent = Math.round((leftCount / total) * 100);
      const rightPercent = 100 - leftPercent;
      const dominant = leftCount >= rightCount ? left : right;
      
      return `
        <div class="bg-gray-50 rounded-xl p-4">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-lg bg-gradient-to-r ${leftColor} bg-clip-text text-transparent">${left}</span>
            <span class="text-gray-500">vs</span>
            <span class="font-bold text-lg bg-gradient-to-r ${rightColor} bg-clip-text text-transparent">${right}</span>
          </div>
          <div class="flex justify-between text-sm text-gray-600 mb-2">
            <span>${leftLabel}</span>
            <span>${rightLabel}</span>
          </div>
          <div class="flex h-3 rounded-full overflow-hidden bg-gray-200">
            <div class="bg-gradient-to-r ${leftColor}" style="width: ${leftPercent}%"></div>
            <div class="bg-gradient-to-r ${rightColor}" style="width: ${rightPercent}%"></div>
          </div>
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>${leftPercent}%</span>
            <span>${rightPercent}%</span>
          </div>
          <div class="text-center mt-2">
            <span class="text-sm font-semibold text-gray-700">倾向：${dominant} (${dominant === left ? leftPercent : rightPercent}%)</span>
          </div>
        </div>
      `;
    }

    function calculateResult() {
      const scores = { A: 0, B: 0, S: 0, C: 0, P: 0, R: 0, D: 0, F: 0 };
      
      Object.values(answers).forEach(value => {
        scores[value]++;
      });
      
      const dim1 = scores.A >= scores.B ? 'A' : 'B';
      const dim2 = scores.S >= scores.C ? 'S' : 'C';
      const dim3 = scores.P >= scores.R ? 'P' : 'R';
      const dim4 = scores.D >= scores.F ? 'D' : 'F';
      
      let typeKey = dim1 + dim2 + dim3 + dim4;
      
      // 16 base types from the 4 dimensions
      const baseTypes = [
        'ASPD', 'ASPF', 'ASRD', 'ASRF',
        'ACPD', 'ACPF', 'ACRD', 'ACRF',
        'BSPD', 'BSPF', 'BSRD', 'BSRF',
        'BCPD', 'BCPF', 'BCRD', 'BCRF'
      ];
      
      // If it's a base type, use it directly
      if (baseTypes.includes(typeKey)) {
        // For the 4 extra types, we remap some edge cases
        // BSPF -> sometimes BSPF2 (when S=5, P=5, F=5 exact match)
        if (typeKey === 'BSPF' && scores.S === 5 && scores.P === 5) {
          typeKey = 'BSPF2';
        }
        // BCPD -> sometimes BCPD2
        else if (typeKey === 'BCPD' && scores.C === 5 && scores.P === 5) {
          typeKey = 'BCPD2';
        }
        // BSRD -> sometimes BSRD2
        else if (typeKey === 'BSRD' && scores.S === 5 && scores.R === 5) {
          typeKey = 'BSRD2';
        }
        // ACPF -> sometimes ACPF2
        else if (typeKey === 'ACPF' && scores.A >= 3 && scores.C === 5 && scores.P >= 3 && scores.F === 5) {
          typeKey = 'ACPF2';
        }
      }
      
      return { typeKey, ...scores };
    }

    function startTest() {
      currentQuestion = 0;
      answers = {};
      render();
    }

    function selectAnswer(questionId, value) {
      answers[questionId] = value;
      render();
    }

    function nextQuestion() {
      if (answers[questions[currentQuestion].id]) {
        currentQuestion++;
        render();
        window.scrollTo(0, 0);
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        render();
        window.scrollTo(0, 0);
      }
    }

    function restartTest() {
      currentQuestion = -1;
      answers = {};
      render();
    }

    // 初始化
    currentQuestion = -1;
    render();
  </script>
</body>
</html>
